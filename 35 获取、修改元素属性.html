<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="img/icon/换一换.png" alt="图片加载失败" title="这是一个图片" width="200px">

    <input class="btn" type="button" value="播放" onclick="OnClick()">
</body>
<script>
    let img = document.querySelector("img")
    console.dir(img)
    img.title = "这是一个修改后的新标题"
    img.onclick = function()
    {
        alert("图片被点击了")
    }

    let btn = document.querySelector(".btn")
    function OnClick()
    {
        if(btn.value == "播放")
        {
            btn.value = "暂停"
        }
        else
        {
            btn.value = "播放"
        }
    }
</script>
</html>
