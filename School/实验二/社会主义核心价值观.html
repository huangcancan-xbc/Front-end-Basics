<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社会主义核心价值观</title>
    <style type="text/css">
        * {padding: 0;margin: 0;}
        div {
            width: 1060px;height: 492px;margin: 0 auto;padding: 50px;
            background: url(img/image-2-2.jpg) no-repeat center center;
        }
        h1 {font-size: 68px;font-family: "隶书";text-align: center;
            color: red;line-height: 70px;}
        h2 {margin: 30px auto;line-height: 50px;}
        strong {margin: 8px 20px;background-color: red;
            color: white;font-size: 32px;}
        dl {margin: 0 auto;text-align: center;}
        dt,dd {
            font-family: 隶书;font-size: 52px;color: #AF0103;
            display: inline;margin: 0 5px;text-shadow: 0 0 15px white;
        }
    </style>
</head>
<body>
    <div>
        <h1>☆社会主义核心价值观☆</h1>
        <h2 align="center">
            <strong>人民有信仰</strong>
            <strong>民族有希望</strong>
            <strong>国家有力量</strong>
        </h2>
        
        <dl>
            <dt>富强</dt>
            <dd>民主</dd>
            <dt>文明</dt>
            <dd>和谐</dd>
        </dl>
        
        <dl>
            <dt>自由</dt>
            <dd>平等</dd>
            <dt>公正</dt>
            <dd>法治</dd>
        </dl>
        
        <dl>
            <dt>爱国</dt>
            <dd>敬业</dd>
            <dt>诚信</dt>
            <dd>友善</dd>
        </dl>
    </div>

</html>
