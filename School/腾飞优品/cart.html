<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 腾飞优品</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="container">
            <div class="nav-wrapper">
                <!-- LOGO -->
                <div class="logo">
                    <img src="img/腾飞优品logo.png" alt="腾飞优品">
                    <span>腾飞优品</span>
                </div>
                
                <!-- 主导航 -->
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html">首页</a></li>
                        <li><a href="digital.html">数码电子</a></li>
                        <li><a href="clothes.html">服装鞋帽</a></li>
                        <li><a href="sports.html">运动户外</a></li>
                    </ul>
                </nav>
                
                <!-- 购物车 -->
                <div class="cart-icon">
                    <a href="cart.html">
                        <img src="img/购物车.png" alt="购物车">
                        <span class="cart-count" id="cartCount">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- 面包屑导航 -->
    <div class="breadcrumb">
        <div class="container">
            <a href="index.html">首页</a>
            <span class="separator">></span>
            <span class="current">购物车</span>
        </div>
    </div>

    <!-- 主要内容 -->
    <main class="cart-main">
        <div class="container">
            <!-- 购物车头部 -->
            <div class="cart-header">
                <h1>我的购物车</h1>
                <p class="cart-desc">精选商品，品质保证，安全购物</p>
            </div>

            <!-- 购物车内容 -->
            <div class="cart-content">
                <!-- 空购物车提示 -->
                <div class="empty-cart" id="emptyCart" style="display: none;">
                    <img src="img/购物车.png">
                    <h3>购物车是空的</h3>
                    <p>快去挑选心仪的商品吧！</p>
                    <a href="index.html" class="btn btn-primary">去购物</a>
                </div>

                <!-- 购物车商品列表 -->
                <div class="cart-items" id="cartItems">
                    <!-- 表头 -->
                    <div class="cart-table-header">
                        <div class="item-info">商品信息</div>
                        <div class="item-price">单价</div>
                        <div class="item-quantity">数量</div>
                        <div class="item-total">小计</div>
                        <div class="item-actions">操作</div>
                    </div>
                    
                    <!-- 商品列表容器 -->
                    <div class="cart-items-list" id="cartItemsList">
                        <!-- 商品项将通过JavaScript动态加载 -->
                    </div>
                </div>

                <!-- 购物车底部 -->
                <div class="cart-footer" id="cartFooter">
                    <div class="cart-actions">
                        <button class="btn btn-danger" id="clearCartBtn">清空购物车</button>
                        <a href="index.html" class="btn">继续购物</a>
                    </div>
                    
                    <div class="cart-summary">
                        <div class="summary-item">
                            <span>商品总数：</span>
                            <span id="totalQuantity">0</span> 件
                        </div>
                        <div class="summary-item total-price">
                            <span>总计：</span>
                            <span class="price" id="totalPrice">¥0</span>
                        </div>
                        <button class="btn btn-primary btn-checkout" id="checkoutBtn">去结算</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>品牌介绍</h3>
                    <p>腾飞优品致力于为用户提供优质的购物体验，精选全球好物，品质保证，服务至上。</p>
                </div>
                <div class="footer-section">
                    <h3>关于我们</h3>
                    <ul>
                        <li><a href="#">公司简介</a></li>
                        <li><a href="#">联系我们</a></li>
                        <li><a href="#">合作伙伴</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>关注我们</h3>
                    <div class="social-links">
                        <a href="#">微信公众号</a>
                        <a href="#">新浪微博</a>
                        <a href="#">抖音号</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 腾飞优品. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
