<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    弹性布局就是让元素可以自动调整大小，以适应不同屏幕大小和设备。
    <div>
        <span>111</span>
        <span>222</span>
        <span>333</span>
    </div>
    <style>
        div {
            display: flex;                        /* 开启弹性布局 */
            flex-wrap: wrap;                      /* 允许换行 */
            justify-content: space-between;       /* 两端对齐 */
            align-items: center;                  /* 垂直居中 */
            height: 100px;                        /* 设置高度 */   
            background-color: #f0f0f0;          /* 设置背景颜色 */
        }
        div span {
            width: 100px;                         /* 设置宽度 */
            height: 100px;                        /* 设置高度 */
            background-color: #43b98a;          /* 设置背景颜色 */
            display: flex;                        /* 开启弹性布局 */
            justify-content: center;              /* 水平居中 */
            align-items: center;                  /* 垂直居中 */
        }
    </style>
</body>
</html>
