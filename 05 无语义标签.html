<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>无语义标签</h1>
        <p>
            无语义标签是指没有明确的含义的标签，比如<span>、<div>、<img>等。
            拿着这个啥都可以干，div是独占一行的，是一个大盒子；span不独占一行，是小盒子；
            img是图片标签，可以插入图片，但没有任何语义。
        </p>
    </div>

    <div>
        <div>
            <span>
                吃饭
            </span>
            <span>
                睡觉
            </span>
            <span>
                打豆豆
            </span>
        </div>
    </div>

    <div>
        <img src="https://www.baidu.com/img/bd_logo1.png" alt="百度logo">
    </div>

    <div>
        <div>
            <div>
                吃饭
            </div>
            <div>
                睡觉
            </div>
            <div>
                打豆豆 
            </div>
        </div>
    </div>


    
</body>
</html>
