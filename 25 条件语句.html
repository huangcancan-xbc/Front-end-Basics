<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script>
    let num = prompt("请输入一个数字：")
    if(num % 2 == 0)
    {
        alert("这是一个偶数")
    }
    else if(num % 2 == 1)
    {
        alert("这是一个奇数")
    }
    else
    {
        alert("这是一个非法输入！")
    }

    let day = prompt("请输入星期几：")
    day = parseInt(day)
    switch(day)
    {
        case 1:
            alert("星期一")
            break
        case 2:
            alert("星期二")
            break
        case 3:
            alert("星期三")
            break
        case 4:
            alert("星期四")
            break
        case 5:
            alert("星期五")
            break
        case 6:
            alert("星期六")
            break
        case 7:
            alert("星期日")
            break
        default:
            alert("请输入正确的星期数！")
    }

</script>
</html>
