<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    function hello()
    {
        console.log("Hello World!")
    }
    let a = hello()
    console.log(a)

    function add(x, y)
    {
        console.log("参数分别是：" + x + " 和 " + y)
        return x + y
    }
    let b = add(2, 3)
    console.log(b)

    // 参数个数没有要求限制
    console.log(add())
    console.log(add(2))
    console.log(add(2, 3, 4))

    // 函数表达式
    let ret = function sum()
    {
        ans = 0
        for(i = 0; i <= 100; i++)
        {
            ans += i
        }

        return ans
    }
    console.log(ret())

    let ret2 = function()
    {
        console.log(arguments)  // arguments是一个类数组对象，包含传入函数的所有参数
    }
    ret2()
    ret2(1, 2, 3, 4, 5)
</script>
</html>
