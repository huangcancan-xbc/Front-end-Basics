<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol li {
            color: red;
            background-color: antiquewhite;
        }

        .parent li {
            color: blue;
            background-color: aquamarine;
        }

        ol a {
            color: green;
            background-color: rgb(225, 236, 139);
        }
    </style>
</head>
<body>
    <ul class="parent">
        <li>一段文字</li>
        <li>一段文字</li>
        <li>一段文字</li>
    </ul>
    <ol>
        <li>一段文字</li>
        <li>一段文字</li>
        <li>一段文字</li>
        <li><a href="#">一段文字</a></li>
    </ol>
</body>
</html>
